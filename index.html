<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Strategy · Warm-Up Questions</title>
<style>
  :root{
    --red:#9D2235;
    --red-dark:#7A1A28;
    --blossom:#F3D8DC;
    --pale:#FCF4F5;
    --charcoal:#1A1A1A;
    --mid:#555555;
    --light:#AAAAAA;
    --rule:#D9BBBD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;color:var(--charcoal);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px}

  .topbar{height:8px;background:var(--red);width:100%}
  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--light);font-weight:bold;
  }

  /* ---------- menu ---------- */
  #menu{min-height:100%;display:flex;flex-direction:column}
  .menu-head{padding:38px 48px 22px;border-bottom:1px solid var(--rule)}
  .menu-head h1{
    font-size:34px;font-weight:bold;color:var(--red);letter-spacing:-.01em;margin-top:10px;
  }
  .menu-body{padding:22px 48px 60px;flex:1}
  .act-label{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);
    font-weight:bold;margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--blossom);
  }
  .wk{
    display:flex;align-items:center;gap:18px;
    padding:13px 16px;border:1px solid var(--rule);border-left:5px solid var(--red);
    margin-bottom:7px;background:#fff;
  }
  .wk:nth-child(even){background:var(--pale)}
  .wk-num{
    font-size:12px;font-weight:bold;color:var(--red);letter-spacing:.1em;
    width:66px;flex:none;text-transform:uppercase
  }
  .wk-name{font-size:17px;font-weight:bold;flex:1}
  .wk-btns{display:flex;gap:8px}
  .daybtn{
    font-size:13px;font-weight:bold;padding:9px 18px;border:1.5px solid var(--red);
    color:var(--red);background:#fff;letter-spacing:.04em;transition:background .12s,color .12s;
  }
  .daybtn:hover{background:var(--red);color:#fff}
  .daybtn[disabled]{
    border-color:var(--rule);color:var(--light);cursor:default;background:transparent;
  }
  .daybtn[disabled]:hover{background:transparent;color:var(--light)}

  /* ---------- quiz ---------- */
  #quiz{display:none;min-height:100%;flex-direction:column}
  #quiz.on{display:flex}
  .q-head{
    display:flex;align-items:center;gap:16px;
    padding:16px 48px;border-bottom:1px solid var(--rule);
  }
  .q-head .who{font-size:12px;font-weight:bold;color:var(--red);letter-spacing:.14em;text-transform:uppercase}
  .q-head .spacer{flex:1}
  .pips{display:flex;gap:6px}
  .pip{width:26px;height:5px;background:var(--blossom)}
  .pip.done{background:var(--red-dark)}
  .pip.now{background:var(--red)}
  .exit{font-size:12px;color:var(--light);letter-spacing:.1em;text-transform:uppercase;font-weight:bold}
  .exit:hover{color:var(--red)}

  .q-body{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:34px 64px;max-width:1180px;margin:0 auto;width:100%;
  }
  .q-text{
    font-size:clamp(24px,3.1vw,42px);font-weight:bold;line-height:1.24;
    letter-spacing:-.015em;margin:14px 0 34px;
  }
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:stretch;border:1px solid var(--rule);background:#fff;
    transition:opacity .25s ease, background .25s ease, border-color .25s ease;
  }
  .opt .num{
    width:58px;flex:none;background:var(--pale);color:var(--red);
    font-size:22px;font-weight:bold;display:flex;align-items:center;justify-content:center;
    border-right:1px solid var(--rule);transition:background .25s,color .25s;
  }
  .opt .txt{
    padding:16px 20px;font-size:clamp(15px,1.55vw,21px);line-height:1.4;display:flex;align-items:center;
  }
  .opt .tick{
    width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:bold;transition:width .25s;
  }
  .revealed .opt{opacity:.28}
  .revealed .opt.right{
    opacity:1;background:var(--red);border-color:var(--red);color:#fff;
  }
  .revealed .opt.right .num{background:var(--red-dark);color:#fff;border-right-color:var(--red-dark)}
  .revealed .opt.right .tick{width:56px;color:#fff}

  .cue{
    margin-top:28px;font-size:15px;color:var(--red);font-weight:bold;
    letter-spacing:.16em;text-transform:uppercase;
  }
  .revealed .cue{display:none}

  .q-foot{
    display:flex;align-items:center;gap:12px;padding:14px 48px;
    border-top:1px solid var(--rule);background:var(--pale);
  }
  .nav{
    font-size:13px;font-weight:bold;padding:10px 22px;border:1.5px solid var(--red);
    color:var(--red);letter-spacing:.04em;
  }
  .nav:hover{background:var(--red);color:#fff}
  .nav.solid{background:var(--red);color:#fff}
  .nav.solid:hover{background:var(--red-dark);border-color:var(--red-dark)}
  .keys{margin-left:auto;font-size:11px;color:var(--light);letter-spacing:.06em}
  .keys kbd{
    font-family:inherit;border:1px solid var(--rule);padding:2px 6px;margin:0 2px;color:var(--mid);
  }

  .end{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--red);color:#fff;text-align:center;padding:40px;
  }
  .end h2{font-size:clamp(30px,4.4vw,60px);font-weight:bold;letter-spacing:-.02em}
  .end p{margin-top:16px;font-size:17px;color:var(--blossom);font-style:italic}
  .end .again{
    margin-top:32px;border:1.5px solid #fff;color:#fff;padding:11px 26px;
    font-size:13px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;
  }
  .end .again:hover{background:#fff;color:var(--red)}

  /* ---------- prep view (instructor only) ---------- */
  .preplink{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:bold;
    color:var(--light);
  }
  .preplink:hover{color:var(--red)}
  #prep{display:none;min-height:100%;flex-direction:column}
  #prep.on{display:flex}
  .prep-head{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:26px 48px 18px;border-bottom:1px solid var(--rule);
  }
  .prep-head h2{font-size:24px;color:var(--red);letter-spacing:-.01em}
  .prep-head .spacer{flex:1}
  .chip{
    font-size:11px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;
    padding:7px 13px;border:1.5px solid var(--rule);color:var(--mid);
  }
  .chip:hover{border-color:var(--red);color:var(--red)}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 48px 0}
  .prep-body{padding:8px 48px 60px;max-width:900px}
  .prep-set{margin-top:30px;page-break-inside:auto}
  .prep-set h3{
    font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;
    background:var(--red);padding:9px 14px;
  }
  .pq{border:1px solid var(--rule);border-top:none;padding:15px 16px;page-break-inside:avoid}
  .pq:nth-child(even){background:var(--pale)}
  .pq .pqn{font-size:11px;font-weight:bold;letter-spacing:.16em;color:var(--red);text-transform:uppercase}
  .pq .pqt{font-size:15px;font-weight:bold;line-height:1.4;margin:5px 0 10px}
  .pq ol{margin:0 0 0 20px;font-size:13.5px;line-height:1.65}
  .pq li.key{font-weight:bold;color:var(--red)}
  .pq li.key::after{content:"  \2713";font-weight:bold}
  .pq .pnote{
    margin-top:11px;padding:10px 12px;background:#fff;border-left:4px solid var(--red-dark);
    font-size:12.5px;line-height:1.55;color:var(--mid);
  }
  .pq:nth-child(even) .pnote{background:var(--blossom)}
  .pq .pnote b{color:var(--red-dark);letter-spacing:.14em;font-size:10px;text-transform:uppercase;display:block;margin-bottom:4px}
  .prep-empty{margin-top:30px;font-size:14px;color:var(--mid);font-style:italic}

  @media print{
    .topbar,.prep-head,.chips,.preplink{display:none!important}
    #menu,#quiz{display:none!important}
    #prep{display:block!important}
    .prep-body{padding:0;max-width:100%}
    .prep-set h3{background:none;color:var(--red);border-bottom:2px solid var(--red);padding-left:0}
    .pq,.pq:nth-child(even){background:none}
    body{font-size:11pt}
  }

  @media (max-width:720px){
    .menu-head,.menu-body,.q-head,.q-foot,.prep-head,.chips,.prep-body{padding-left:20px;padding-right:20px}
    .q-body{padding:24px 20px}
    .wk{flex-wrap:wrap;gap:10px}
    .keys{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar"></div>

<!-- ============ MENU ============ -->
<div id="menu">
  <div class="menu-head" style="display:flex;align-items:flex-end;gap:16px">
    <div style="flex:1">
      <div class="eyebrow">MKTG 44303 &middot; Retail Strategy</div>
      <h1>Warm-Up Questions</h1>
    </div>
    <button class="preplink" onclick="showPrep()">Prep view</button>
  </div>
  <div class="menu-body">
    <div class="act-label" id="act0Label" style="display:none">Foundations</div>
    <div id="act0"></div>
    <div class="act-label">Act 1 &mdash; When Purpose Works</div>
    <div id="act1"></div>
    <div class="act-label">Act 2 &mdash; When Purpose Gets Complicated</div>
    <div id="act2"></div>
  </div>
</div>

<!-- ============ PREP VIEW (instructor only) ============ -->
<div id="prep">
  <div class="prep-head">
    <h2>Prep view</h2>
    <span style="font-size:12px;color:var(--mid);font-style:italic">Source order &mdash; the projector shuffles options</span>
    <span class="spacer"></span>
    <button class="chip" onclick="window.print()">Print</button>
    <button class="chip" onclick="hidePrep()">Close</button>
  </div>
  <div class="chips" id="prepChips"></div>
  <div class="prep-body" id="prepBody"></div>
</div>

<!-- ============ QUIZ ============ -->
<div id="quiz">
  <div class="q-head">
    <span class="who" id="qWho"></span>
    <span class="spacer"></span>
    <div class="pips" id="qPips"></div>
    <button class="exit" onclick="goMenu()">Close</button>
  </div>
  <div id="qStage"></div>
  <div class="q-foot" id="qFoot">
    <button class="nav" id="btnBack" onclick="prev()">&larr; Back</button>
    <button class="nav solid" id="btnMain" onclick="advance()">Show answer</button>
    <span class="keys">
      <kbd>Space</kbd> reveal &middot; <kbd>&rarr;</kbd> next &middot; <kbd>&larr;</kbd> back &middot; <kbd>Esc</kbd> menu
    </span>
  </div>
</div>

<script>
/* ============================================================
   QUESTION DATA

   One entry per week. `mon` and `wed` each hold 5 questions.
   An empty array ( [] ) greys that day's button out.

   Question shape:
   { q:    "Question text",
     opts: ["Option 1","Option 2","Option 3","Option 4"],
     ans:  2,                      <-- 0 = first option, 1 = second, etc.
     note: "Instructor note."       <-- optional; NEVER shown in class.
   }                                    Appears only in Prep view.

   The on-screen prompt students see before each reveal is set
   in CUE_TEXT just below. Set it to "" to hide it entirely.
   ============================================================ */

const CUE_TEXT = "Lock in your answer";

const WEEKS = [
  { wk:1, act:0, name:"Foundations \u2014 HBR Reading",
    mon:[],
    wed:[
      { q:"According to \"Put Purpose at the Core of Your Strategy\" (Malnight, Buche & Dhanaraj), purpose most powerfully serves a company's strategy when it:",
        opts:["Functions as a values statement that unifies culture, separate from business results", "Is treated as an add-on used mainly for social good and employee morale", "Sits at the core of strategy, directly shaping decisions, capabilities, and growth - not treated as a peripheral extra", "Replaces the need for a competitive strategy altogether"],
        ans:2,
        note:"Opener. This is the article's central move: purpose is usually talked about as an add-on (culture, morale, giving back), and the authors argue the highest-growth companies instead put it at the core. Good place to ask before revealing: 'Where have you seen a company's stated purpose feel like decoration rather than strategy?'" },
      { q:"Mars Petcare could have stayed focused on pet food, its original category. Instead, its purpose - \"a better world for pets\" - guided it to expand into:",
        opts:["Competing pet-food brands, to grow share within its existing category", "Veterinary hospitals, pet insurance-adjacent services, and eventually pet-health technology - a broader ecosystem beyond pet food", "New retail store formats for selling pet food directly to consumers", "A packaging redesign focused on premium shelf appeal"],
        ans:1,
        note:"Tests the Mars Petcare example specifically. This is the article's clearest illustration of 'redefining the playing field' - purpose didn't just inspire a campaign, it pointed the company toward acquisitions (Banfield, BluePearl, VCA, AniCura) that took it out of its original category entirely. Contrast with Purina, which kept the same purpose language but stayed in pet food." },
      { q:"Neste, a Finnish oil-refining company for over six decades, used its purpose to move into an entirely new business: renewable fuels. What made this the moment for that shift, according to the article?",
        opts:["A government mandate ordering the company to abandon oil refining", "A glutted, declining oil market and new EU emissions legislation that made the traditional playing field unsustainable", "A merger with an existing renewable-energy company", "Customer surveys showing no remaining demand for oil products"],
        ans:1,
        note:"Neste's shift wasn't proactive idealism - it came out of real pressure: falling margins, a 50% drop in market value, new regulation. Worth surfacing: purpose here functioned as a strategic response to a business in trouble, not just a mission statement written in good times. That framing matters for how students should read every retailer case this semester." },
      { q:"Beyond redefining the playing field, the article describes a second role purpose plays: reshaping the value proposition. Companies do this in three main ways - responding to trends, building on trust, and:",
        opts:["Cutting prices to undercut competitors on value", "Focusing on unmet customer pain points", "Rebranding with new visual identity and messaging", "Outsourcing production to lower costs"],
        ans:1,
        note:"Direct recall of the article's three mechanisms. Securitas responded to trends (shifting risk landscape), Mahindra Finance built on trust (extending into insurance and housing once it earned rural customers' confidence), and Mars Petcare's Whistle acquisition focused on a pain point (preventing pet health problems before they happen). Naming these three now gives students vocabulary they'll reuse all semester." },
      { q:"The article's diagnostic asks whether purpose: (1) drives growth and profitability today, (2) shapes strategic and investment decisions, (3) shapes the core value proposition, (4) shapes how organizational capabilities are built and managed, and (5) is a standing item on the leadership team's agenda every time it meets. A company can only claim purpose is truly at the CORE of its strategy if it can answer yes to:",
        opts:["All five - growth and profitability today, investment decisions, the value proposition, organizational capabilities, and the leadership agenda every meeting", "Three of the five - the value proposition, the leadership agenda, and growth and profitability today are enough on their own", "Two of the five - shaping the value proposition and appearing on the leadership agenda are the two that matter most", "None specifically - the article treats any one of the five, pursued consistently over time, as sufficient"],
        ans:0,
        note:"DISCUSSION QUESTION - worth opening up rather than moving past quickly. The standard is deliberately strict: 'NOT UNLESS you answer yes to all five.' The three wrong answers are built to feel reasonable - each keeps the two items easiest to fake (value proposition language, a leadership-meeting mention) while dropping the three that actually cost money and effort (investment, capabilities, current profitability). That's worth naming directly: those three are exactly the questions a company that's only talking about purpose, rather than committing to it, would fail. Good follow-up once revealed: 'Which of the five would be hardest for most companies to honestly answer yes to?' This previews the whole semester - almost every retailer we study will pass some of these five and fail others, and figuring out which is failing is most of the analytical work ahead." }
    ]
  },
  { wk:2, act:1, name:"Patagonia",
    mon:[
      { q:"Patagonia transferred ownership in 2022. Who now holds decision-making authority over the company?",
        opts:["A consortium of institutional investors and ESG funds", "The Patagonia Purpose Trust and the Holdfast Collective", "Yvon Chouinard's family trust, which retains voting control", "A publicly traded B Corporation listed on the NYSE"],
        ans:1,
        note:"Wrong answers are plausible - institutional ESG funds and family trusts are both common structures for mission-driven companies. The correct answer is the one structure that legally removes shareholder profit as the primary goal. If fewer than 60% get this right, pause and clarify: the Trust holds voting shares; Holdfast Collective holds economic shares and directs profits to environmental grants." },
      { q:"Patagonia's Worn Wear program allows customers to do which of the following?",
        opts:["Earn loyalty points redeemable for discounts on new Patagonia products", "Donate used clothing to Patagonia for tax deductions", "Buy, sell, and repair used Patagonia gear through the company's own platform", "Subscribe to a monthly box of curated secondhand outdoor gear from any brand"],
        ans:2,
        note:"Option 4 is a plausible distractor because recommerce subscriptions exist. The key distinction is that Worn Wear is brand-specific and company-operated - Patagonia runs the resale and repair platform themselves, making it a strategic moat rather than just participation in the resale market." },
      { q:"Patagonia's Ironclad Guarantee means the company will:",
        opts:["Guarantee that all products are made from 100% recycled or organic materials", "Repair or replace any Patagonia product for any reason, at any time", "Guarantee that the carbon footprint of every product is independently verified", "Offer a price-match guarantee against any competitor's product"],
        ans:1,
        note:"Option 1 is a plausible distractor - Patagonia does use sustainable materials extensively, but the Ironclad Guarantee is specifically about product longevity and repair. Reinforces the 4-pillar Customer Service discussion." },
      { q:"What distinguishes a 'Purpose-Embedded' company from a 'Purpose-Pioneering' company in the Purpose Authenticity Framework?",
        opts:["Purpose-Pioneering companies are larger and have more resources to invest in sustainability", "Purpose-Embedded companies have B Corp certification; Purpose-Pioneering companies do not", "Purpose-Pioneering companies have legally structured their organization so purpose cannot be overridden by profit motive - going beyond voluntary commitments", "Purpose-Embedded companies operate only in niche markets; Purpose-Pioneering companies compete in mass markets"],
        ans:2,
        note:"This is the hardest Monday question and most important for Wednesday prep. The Embedded/Pioneering distinction is structural/legal, not just behavioral. Option 2 is a trap - B Corp is consistent with Purpose-Embedded, but Purpose-Pioneering requires going further with irreversible structural commitment. Worth 30 seconds of discussion if time allows." },
      { q:"Which BEST describes the strategic logic behind Patagonia's store location choices?",
        opts:["Patagonia locations are chosen to maximize foot traffic through proximity to high-volume shopping malls and tourist destinations", "Patagonia places stores in outdoor recreation communities and eco-conscious urban markets, deliberately avoiding mass retail contexts", "Patagonia's store locations are determined primarily by franchise partner preferences and local real estate availability", "Patagonia has no physical retail strategy - the company operates exclusively direct-to-consumer online"],
        ans:1,
        note:"Option 4 is a strong distractor for students who didn't do the prep (many premium DTC brands are online-only). The correct answer reinforces that Patagonia's location strategy is a brand signal - being in Moab or Burlington rather than a mall communicates authenticity to the outdoor community." }
    ],
    wed:[
      { q:"Which specific action MOST clearly places Patagonia at 'Purpose-Pioneering' rather than 'Purpose-Embedded'?",
        opts:["Patagonia's use of recycled and organic materials across its product line", "Patagonia's B Corp certification and Fair Trade supplier commitments", "The 2022 transfer of ownership to the Patagonia Purpose Trust, legally embedding the environmental mission in governance", "Patagonia's 1% for the Planet commitment, donating 1% of sales to environmental nonprofits"],
        ans:2,
        note:"Options 1, 2, and 4 are all legitimate purpose-aligned actions - but they are reversible. A future CEO could end any of them. The Trust structure is legally designed to be irreversible. This irreversibility is what defines Purpose-Pioneering. Confusion is usually between 'doing good things' and 'structurally committing to doing good things.'" },
      { q:"One of the most credible environmental criticisms of Patagonia's core business is that:",
        opts:["Patagonia's supply chain has never been audited by a third party, making its sustainability claims unverifiable", "Patagonia's primary products (synthetic fleece, nylon shells) shed microplastics into waterways with every wash", "Patagonia has lobbied against US climate legislation that would affect its manufacturing costs", "Patagonia's Worn Wear program actually increases total consumption by making secondhand gear more accessible and affordable"],
        ans:1,
        note:"Comes directly from Source 7 (the critical counterpoint). Students who only read company-authored materials will likely miss this. This question rewards engagement with the critical source - essential for Act 2 of the course, which requires holding positive and negative evidence simultaneously. Option 4 (the 'rebound effect') is a real phenomenon but less specific and documented than microplastics." },
      { q:"Patagonia's 2022 ownership transfer benefited some stakeholders and imposed costs on others. Which stakeholder group bears the clearest COST from this decision?",
        opts:["Customers, who now pay higher prices because profits no longer fund product innovation", "The natural environment, because the Trust limits how aggressively Patagonia can reinvest in new sustainable technologies", "Traditional shareholders and outside investors, who no longer have a path to financial returns from Patagonia's growth", "Employees, who lost equity participation opportunities as a result of the Trust structure"],
        ans:2,
        note:"DISCUSSION QUESTION - intentionally open to interpretation; consider opening for class discussion. Option 3 is most defensible because the Trust explicitly removed external investment returns. Option 4 is a legitimate partial answer. Worth surfacing the nuance: 'cost' and 'benefit' depend entirely on which stakeholder lens you use." },
      { q:"According to the Stakeholder vs. Shareholder Orientation framework, what distinguishes a genuine stakeholder orientation from one that is merely rhetorical?",
        opts:["The company has published a mission statement that names stakeholders beyond shareholders", "The company has governance, certification, or legal structures that hold it accountable to non-shareholder groups", "The company's revenue has grown since it started using stakeholder-focused messaging", "Public figures or reviewers have publicly praised the company's stakeholder commitments"],
        ans:1,
        note:"Tests the framework's core distinction, not just its vocabulary. Each wrong answer is a real signal companies point to, but none of them is binding: a mission statement can be rewritten, revenue growth can have nothing to do with stakeholder claims, and praise is reputational rather than structural. The correct answer is the same test the Purpose Authenticity Framework applies to Patagonia's own Trust structure - is the commitment enforceable, or just declared? Good bridge line: 'This is the same question you'll ask about every retailer for the rest of the semester.'" },
      { q:"Patagonia's 'Don't Buy This Jacket' advertising campaign is strategically significant primarily because it:",
        opts:["Successfully reduced Patagonia's total unit sales, demonstrating genuine environmental commitment", "Used anti-consumerism messaging to build brand trust and awareness, which ultimately drove higher brand equity and customer loyalty - potentially increasing long-term revenue", "Was required under Patagonia's B Corp certification to disclose the environmental impact of each purchase", "Targeted competitor customers who were considering switching to less sustainable brands"],
        ans:1,
        note:"Option 1 is the naive reading - the campaign did NOT reduce sales; it boosted brand equity significantly. The correct answer captures the strategic genius: using anti-marketing as the most effective form of marketing for purpose-aligned consumers. This is the 'permission paradox' of purpose-driven retail. If time allows: 'If Patagonia launches home goods and runs a similar campaign, does it work the same way? Why or why not?' - primes Friday perfectly." }
    ]
  },
  { wk:3, act:1, name:"ABLE",
    mon:[
      { q:"ABLE describes itself as which of the following?",
        opts:["A sustainable fashion brand focused on reducing carbon emissions", "A justice organization that happens to be in the fashion industry", "A luxury accessories brand committed to ethical sourcing", "A Nashville lifestyle company inspired by Southern craftsmanship"],
        ans:1,
        note:"This quote from Barrett Ward (Source 3) is the case's central framing. Wrong answers 3 and 4 are plausible from surface-level brand knowledge; 1 is the kind of thing students who skimmed the intro paragraph might guess. The correct answer signals that students engaged with the primary interview source. Open for brief discussion: Why does the word 'justice' matter here instead of 'sustainability' or 'ethical'?" },
      { q:"ABLE is legally structured as which of the following?",
        opts:["A nonprofit organization funded by donor contributions", "A publicly traded company on the NYSE", "A benefit corporation and certified B Corp", "A cooperative owned by its manufacturing workers"],
        ans:2,
        note:"Option 1 is plausible because ABLE started as a nonprofit. Option 4 is an interesting distractor because it describes what ABLE values (worker ownership) without being accurate. The benefit corporation / B Corp answer rewards students who read past the origin story to understand how the company is actually structured today." },
      { q:"What does ABLE publish that no other fashion brand had done before it?",

let cur = null;
let idx = 0;
let shown = false;

function buildMenu(){
  var haveFoundations = WEEKS.some(function(w){ return w.act===0 && (w.mon.length||w.wed.length); });
  document.getElementById("act0Label").style.display = haveFoundations ? "" : "none";
  [0,1,2].forEach(function(act){
    var host = document.getElementById("act"+act);
    host.innerHTML = "";
    WEEKS.filter(function(w){return w.act===act;}).forEach(function(w){
      var row = document.createElement("div");
      row.className = "wk";
      row.innerHTML =
        '<span class="wk-num">Week '+w.wk+'</span>'+
        '<span class="wk-name">'+w.name+'</span>';
      var btns = document.createElement("div");
      btns.className = "wk-btns";
      [["Monday","mon"],["Wednesday","wed"]].forEach(function(pair){
        var b = document.createElement("button");
        b.className = "daybtn";
        b.textContent = pair[0];
        if(!w[pair[1]].length){ b.disabled = true; }
        else { b.onclick = function(){ start(w, pair[0], w[pair[1]]); }; }
        btns.appendChild(b);
      });
      row.appendChild(btns);
      host.appendChild(row);
    });
  });
}

/* Shuffle option order fresh each time a set is opened, so no answer-position
   pattern survives across the three sections. Questions flagged fixed:true keep
   their source order (ascending magnitudes, "all three" options, etc.).
   Prep view always reads the unshuffled source order. */
function shuffleSet(qs){
  return qs.map(function(item){
    if(item.fixed){
      return { q:item.q, opts:item.opts.slice(), ans:item.ans };
    }
    var order = item.opts.map(function(_, i){ return i; });
    for(var i = order.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    return {
      q: item.q,
      opts: order.map(function(k){ return item.opts[k]; }),
      ans: order.indexOf(item.ans)
    };
  });
}

function start(week, dayLabel, qs){
  cur = { week:week, dayLabel:dayLabel, qs:shuffleSet(qs) };
  idx = 0; shown = false;
  document.getElementById("menu").style.display = "none";
  document.getElementById("quiz").classList.add("on");
  render();
}

function goMenu(){
  cur = null;
  document.getElementById("quiz").classList.remove("on");
  document.getElementById("menu").style.display = "flex";
}

function render(){
  var stage = document.getElementById("qStage");
  var foot  = document.getElementById("qFoot");

  document.getElementById("qWho").textContent =
    "Week "+cur.week.wk+" \u00b7 "+cur.week.name+" \u00b7 "+cur.dayLabel;

  if(idx >= cur.qs.length){
    document.getElementById("qPips").innerHTML = "";
    foot.style.display = "none";
    stage.outerHTML =
      '<div class="end" id="qStage">'+
        '<h2>That&rsquo;s the warm-up.</h2>'+
        '<p>Let&rsquo;s get into it.</p>'+
        '<button class="again" onclick="goMenu()">Back to the semester</button>'+
      '</div>';
    return;
  }

  foot.style.display = "flex";
  var item = cur.qs[idx];

  document.getElementById("qPips").innerHTML = cur.qs.map(function(_,i){
    return '<span class="pip '+(i<idx?"done":(i===idx?"now":""))+'"></span>';
  }).join("");

  var opts = item.opts.map(function(t,i){
    return '<div class="opt'+(i===item.ans?" right":"")+'">'+
      '<div class="num">'+(i+1)+'</div>'+
      '<div class="txt">'+t+'</div>'+
      '<div class="tick">&#10003;</div>'+
    '</div>';
  }).join("");

  stage.outerHTML =
    '<div class="q-body'+(shown?" revealed":"")+'" id="qStage">'+
      '<div class="eyebrow">Question '+(idx+1)+' of '+cur.qs.length+'</div>'+
      '<div class="q-text">'+item.q+'</div>'+
      '<div class="opts">'+opts+'</div>'+
      (CUE_TEXT ? '<div class="cue">'+CUE_TEXT+'</div>' : '')+
    '</div>';

  document.getElementById("btnMain").textContent =
    shown ? (idx === cur.qs.length-1 ? "Finish" : "Next question") : "Show answer";
}

function advance(){
  if(!cur) return;
  if(!shown){ shown = true; } else { idx++; shown = false; }
  render();
}

function prev(){
  if(!cur) return;
  if(shown){ shown = false; render(); }
  else if(idx > 0){ idx--; shown = true; render(); }
  else { goMenu(); }
}


/* ---------- prep view (instructor only, never shown in class) ---------- */
var prepFilter = "all";

function loadedSets(){
  var out = [];
  WEEKS.forEach(function(w){
    if(w.mon.length) out.push({w:w, day:"Monday",    qs:w.mon});
    if(w.wed.length) out.push({w:w, day:"Wednesday", qs:w.wed});
  });
  return out;
}

function showPrep(){
  document.getElementById("menu").style.display = "none";
  document.getElementById("quiz").classList.remove("on");
  document.getElementById("prep").classList.add("on");
  buildPrep();
}

function hidePrep(){
  document.getElementById("prep").classList.remove("on");
  document.getElementById("menu").style.display = "flex";
}

function setPrepFilter(v){ prepFilter = v; buildPrep(); }

function buildPrep(){
  var sets = loadedSets();

  var chips = ['<button class="chip'+(prepFilter==="all"?" on":"")+'" onclick="setPrepFilter(\'all\')">All weeks</button>'];
  var seen = {};
  sets.forEach(function(s){
    if(seen[s.w.wk]) return;
    seen[s.w.wk] = true;
    chips.push('<button class="chip'+(prepFilter===String(s.w.wk)?" on":"")+
      '" onclick="setPrepFilter(\''+s.w.wk+'\')">Wk '+s.w.wk+' &middot; '+s.w.name+'</button>');
  });
  document.getElementById("prepChips").innerHTML = chips.join("");

  var show = sets.filter(function(s){ return prepFilter==="all" || String(s.w.wk)===prepFilter; });

  if(!show.length){
    document.getElementById("prepBody").innerHTML =
      '<div class="prep-empty">No questions loaded yet.</div>';
    return;
  }

  document.getElementById("prepBody").innerHTML = show.map(function(s){
    var qs = s.qs.map(function(item,i){
      var lis = item.opts.map(function(t,j){
        return '<li'+(j===item.ans?' class="key"':'')+'>'+t+'</li>';
      }).join("");
      return '<div class="pq">'+
        '<div class="pqn">Question '+(i+1)+'</div>'+
        '<div class="pqt">'+item.q+'</div>'+
        '<ol>'+lis+'</ol>'+
        (item.note ? '<div class="pnote"><b>Instructor note</b>'+item.note+'</div>' : '')+
      '</div>';
    }).join("");
    return '<div class="prep-set">'+
      '<h3>Week '+s.w.wk+' &middot; '+s.w.name+' &middot; '+s.day+'</h3>'+qs+
    '</div>';
  }).join("");
}

document.addEventListener("keydown", function(e){
  if(document.getElementById("prep").classList.contains("on")){
    if(e.key==="Escape") hidePrep();
    return;
  }
  if(!cur){
    if(e.key==="P"||e.key==="p"){ if(e.shiftKey) showPrep(); }
    return;
  }
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); advance(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if(e.key==="Escape"){ goMenu(); }
});

buildMenu();
</script>
